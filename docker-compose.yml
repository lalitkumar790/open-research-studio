services:
  open-research-studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      TECTONIC_BIN: /usr/local/bin/tectonic
      ORS_COMPILER_TOKEN: ${ORS_COMPILER_TOKEN:?Set ORS_COMPILER_TOKEN in the server environment}
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    volumes:
      - tectonic-cache:/tmp/ors-tectonic-cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

volumes:
  tectonic-cache:
